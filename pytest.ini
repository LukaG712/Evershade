[pytest]
# Default to skipping integration tests (require live services)
addopts = -m "not integration" --strict-markers
markers =
    integration: marks tests as requiring live services (deselect with '-m "not integration"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
