# Unified Workflow — Greenie + Slinker + Trapper
# Run: docker compose up -d

version: '3.8'

services:
  # ─── Redis (shared by Trapper) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Greenie (main dashboard, port 8080) ──────────────────────────────
  Greenie:
    build: ./Greenie
    ports:
      - "8080:8080"
    environment:
      - HUB_API_KEY=${HUB_API_KEY:-Greenie-dev-key-change-me}
      - HUB_PORT=8080
      - HUB_TIMEOUT=1800
      - JUNIE_BIN=${JUNIE_BIN:-junie}
      # Slinker integration
      - Slinker_URL=http://Slinker:8000
      - Slinker_API_KEY=${Slinker_API_KEY:-Slinker-dev-key-change-me}
      # Trapper integration
      - Trapper_URL=http://Trapper-api:3000
      - Trapper_API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      # Ollama (optional)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Redis (for multi-instance cluster support)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./Greenie/hub.yaml:/app/hub.yaml
      - ./Greenie/data:/app/data
      - ./Greenie/skills:/app/skills
      # Mount workspace so agents can access projects
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      redis:
        condition: service_healthy
      Slinker:
        condition: service_healthy
      Trapper-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Slinker (execution engine, port 8000) ────────────────────────────
  Slinker:
    build: ./Slinker
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${Slinker_API_KEY:-Slinker-dev-key-change-me}
      - PORT=8000
      - JUNIE_TIMEOUT=1800
      - JUNIE_BIN=${JUNIE_BIN:-junie}
      - WORKSPACE_PATH=/workspace
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-1}
      - ISOLATION_MODE=${ISOLATION_MODE:-worktree}
      # Ollama (optional)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:12b}
      - REFINE_PROMPT=${REFINE_PROMPT:-false}
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - Slinker_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Trapper API (web scraping, port 3000) ───────────────────────────
  Trapper-api:
    build: ./Trapper
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_MAX=60
      - RATE_LIMIT_WINDOW_MS=60000
      - SCRAPE_TIMEOUT=30000
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=10
      - CRAWL_MAX_PAGES=100
      - CRAWL_MAX_CONCURRENCY=5
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=true
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ─── Trapper Worker (background crawl jobs) ──────────────────────────
  Trapper-worker:
    build: ./Trapper
    command: node dist/worker.js
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPE_TIMEOUT=30000
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=10
      - CRAWL_MAX_PAGES=100
      - CRAWL_MAX_CONCURRENCY=5
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=true
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  Slinker_logs:
