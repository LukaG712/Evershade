# Evershade ~ Full Ecosystem
# Run: docker compose up -d

version: '3.8'

services:
  # ─── Redis (shared by Trapper) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Greenie (main dashboard, port 8080) ──────────────────────────────
  Greenie:
    build: ./Greenie
    ports:
      - "8080:8080"
    environment:
      - HUB_API_KEY=${HUB_API_KEY:-Greenie-dev-key-change-me}
      - HUB_PORT=8080
      - HUB_TIMEOUT=1800
      - JUNIE_BIN=${JUNIE_BIN:-junie}
      # Slinker integration
      - Slinker_URL=http://Slinker:8000
      - Slinker_API_KEY=${Slinker_API_KEY:-Slinker-dev-key-change-me}
      # Trapper integration
      - Trapper_URL=http://Trapper-api:3000
      - Trapper_API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      # Gobber integration
      - GOBBER_URL=http://Gobber:8085
      - GOBBER_API_KEY=${GOBBER_API_KEY:-Gobber-dev-key-change-me}
      # Sneaker integration
      - SNEAKER_URL=http://Sneaker:8086
      - SNEAKER_API_KEY=${SNEAKER_API_KEY:-Sneaker-dev-key-change-me}
      # Hider integration
      - HIDER_URL=http://Hider:8087
      - HIDER_API_KEY=${HIDER_API_KEY:-Hider-dev-key-change-me}
      # Poltergeist integration
      - POLTERGEIST_URL=http://Poltergeist:8088
      - POLTERGEIST_API_KEY=${POLTERGEIST_API_KEY:-Poltergeist-dev-key-change-me}
      # Shrewd integration
      - SHREWD_URL=http://Shrewd:8089
      - SHREWD_API_KEY=${SHREWD_API_KEY:-Shrewd-dev-key-change-me}
      # Ollama (optional)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Redis (for multi-instance cluster support)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./Greenie/hub.yaml:/app/hub.yaml
      - ./Greenie/data:/app/data
      - ./Greenie/skills:/app/skills
      # Mount workspace so agents can access projects
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      redis:
        condition: service_healthy
      Slinker:
        condition: service_healthy
      Trapper-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Slinker (execution engine, port 8000) ────────────────────────────
  Slinker:
    build: ./Slinker
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${Slinker_API_KEY:-Slinker-dev-key-change-me}
      - PORT=8000
      - JUNIE_TIMEOUT=1800
      - JUNIE_BIN=${JUNIE_BIN:-junie}
      - WORKSPACE_PATH=/workspace
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-1}
      - ISOLATION_MODE=${ISOLATION_MODE:-worktree}
      # Ollama (optional)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:12b}
      - REFINE_PROMPT=${REFINE_PROMPT:-false}
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - Slinker_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Trapper API (web scraping, port 3000) ───────────────────────────
  Trapper-api:
    build: ./Trapper
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_MAX=60
      - RATE_LIMIT_WINDOW_MS=60000
      - SCRAPE_TIMEOUT=30000
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=10
      - CRAWL_MAX_PAGES=100
      - CRAWL_MAX_CONCURRENCY=5
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=true
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # ─── Trapper Worker (background crawl jobs) ──────────────────────────
  Trapper-worker:
    build: ./Trapper
    command: node dist/worker.js
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${Trapper_API_KEY:-Trapper-dev-key-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPE_TIMEOUT=30000
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=10
      - CRAWL_MAX_PAGES=100
      - CRAWL_MAX_CONCURRENCY=5
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=true
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Gobber (persistent storage, port 8085) ──────────────────────────
  Gobber:
    build: ./Gobber
    ports:
      - "8085:8085"
    environment:
      - API_KEY=${GOBBER_API_KEY:-Gobber-dev-key-change-me}
      - DB_PATH=/app/data/gobber.db
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - gobber_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ─── Sneaker (observability, port 8086) ──────────────────────────────
  Sneaker:
    build: ./Sneaker
    ports:
      - "8086:8086"
    environment:
      - API_KEY=${SNEAKER_API_KEY:-Sneaker-dev-key-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ─── Hider (secrets/config, port 8087) ───────────────────────────────
  Hider:
    build: ./Hider
    ports:
      - "8087:8087"
    environment:
      - API_KEY=${HIDER_API_KEY:-Hider-dev-key-change-me}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-in-production}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ─── Poltergeist (notifications, port 8088) ────────────────────────────
  Poltergeist:
    build: ./Poltergeist
    ports:
      - "8088:8088"
    environment:
      - API_KEY=${POLTERGEIST_API_KEY:-Poltergeist-dev-key-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ─── Shrewd (LLM abstraction, port 8089) ───────────────────────────
  Shrewd:
    build: ./Shrewd
    ports:
      - "8089:8089"
    environment:
      - API_KEY=${SHREWD_API_KEY:-Shrewd-dev-key-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Slammer (web dashboard, port 5173) ───────────────────────────────
  Slammer:
    build: ./Slammer
    ports:
      - "5173:80"
    depends_on:
      - Greenie
    restart: unless-stopped

volumes:
  redis_data:
  Slinker_logs:
  gobber_data:
