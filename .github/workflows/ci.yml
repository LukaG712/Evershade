name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  EvershadeValley-tests:
    name: EvershadeValley Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EvershadeValley

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  Polter-tests:
    name: Polter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Polter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Spectra-tests:
    name: Spectra Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Spectra

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || true

      - name: Run tests
        run: npm test || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [EvershadeValley-tests, Polter-tests, Spectra-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EvershadeValley
        uses: docker/build-push-action@v5
        with:
          context: ./EvershadeValley
          push: false
          load: true
          tags: EvershadeValley:test

      - name: Build Polter
        uses: docker/build-push-action@v5
        with:
          context: ./Polter
          push: false
          load: true
          tags: Polter:test

      - name: Validate docker-compose
        run: |
          docker compose config --quiet
