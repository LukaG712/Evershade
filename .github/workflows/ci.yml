name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  Greenie-tests:
    name: Greenie Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Greenie

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  Slinker-tests:
    name: Slinker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Slinker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Trapper-tests:
    name: Trapper Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trapper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || true

      - name: Run tests
        run: npm test || true

  Gobber-tests:
    name: Gobber Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Gobber

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Creeper-tests:
    name: Creeper Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Creeper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Hider-tests:
    name: Hider Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hider

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Polterpup-tests:
    name: Polterpup Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Polterpup

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Chauncey-tests:
    name: Chauncey Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chauncey

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || true

  Ranger-build:
    name: Ranger Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ranger

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [Greenie-tests, Slinker-tests, Trapper-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Greenie
        uses: docker/build-push-action@v5
        with:
          context: ./Greenie
          push: false
          load: true
          tags: Greenie:test

      - name: Build Slinker
        uses: docker/build-push-action@v5
        with:
          context: ./Slinker
          push: false
          load: true
          tags: Slinker:test

      - name: Build Gobber
        uses: docker/build-push-action@v5
        with:
          context: ./Gobber
          push: false
          load: true
          tags: Gobber:test

      - name: Build Creeper
        uses: docker/build-push-action@v5
        with:
          context: ./Creeper
          push: false
          load: true
          tags: Creeper:test

      - name: Build Hider
        uses: docker/build-push-action@v5
        with:
          context: ./Hider
          push: false
          load: true
          tags: Hider:test

      - name: Build Polterpup
        uses: docker/build-push-action@v5
        with:
          context: ./Polterpup
          push: false
          load: true
          tags: Polterpup:test

      - name: Build Chauncey
        uses: docker/build-push-action@v5
        with:
          context: ./Chauncey
          push: false
          load: true
          tags: Chauncey:test

      - name: Build Ranger
        uses: docker/build-push-action@v5
        with:
          context: ./Ranger
          push: false
          load: true
          tags: Ranger:test

      - name: Validate docker-compose
        run: |
          docker compose config --quiet
