name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose config
        run: |
          docker compose config --quiet

      - name: Check shell script syntax (Bash)
        run: |
          bash -n start.sh
          bash -n stop.sh

      - name: Check PowerShell script syntax
        run: |
          pwsh -NoProfile -Command '
            $errors = @()
            $nulls = $null
            [System.Management.Automation.Language.Parser]::ParseFile("start.ps1", [ref]$nulls, [ref]$errors)
            if ($errors.Count -gt 0) { exit 1 }
          '
          pwsh -NoProfile -Command '
            $errors = @()
            $nulls = $null
            [System.Management.Automation.Language.Parser]::ParseFile("stop.ps1", [ref]$nulls, [ref]$errors)
            if ($errors.Count -gt 0) { exit 1 }
          '

      - name: Verify required files exist
        run: |
          test -f docker-compose.yml || { echo "docker-compose.yml not found"; exit 1; }
          test -f .env.example || { echo ".env.example not found"; exit 1; }
          test -f start.sh || { echo "start.sh not found"; exit 1; }
          test -f start.ps1 || { echo "start.ps1 not found"; exit 1; }
          test -f stop.sh || { echo "stop.sh not found"; exit 1; }
          test -f stop.ps1 || { echo "stop.ps1 not found"; exit 1; }

      - name: Verify service directories are gitignored
        run: |
          for dir in Greenie Slinker Trapper Gobber Sneaker Hider Poltergeist Shrewd Slammer; do
            grep -q "^${dir}/$" .gitignore || { echo "$dir/ not in .gitignore"; exit 1; }
          done

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./Greenie
          pip install -r requirements-test.txt

      - name: Run unit tests (skip integration tests)
        run: |
          python -m pytest tests/ -v -m "not integration" --tb=short

      - name: Run integration tests (with services)
        if: false  # Enable when Docker Compose services are available in CI
        run: |
          docker compose --profile minimal up -d
          sleep 30  # Wait for services to start
          python -m pytest tests/ -v -m "integration" --tb=short
          docker compose down

  subproject-ci:
    name: Sub-project CI Status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check sub-project CI status
        run: |
          echo "Each sub-project has its own CI pipeline in its own repository."
          echo ""
          echo "Sub-projects and their repos:"
          echo "  Greenie:     https://github.com/LukaG712/Greenie"
          echo "  Slinker:     https://github.com/LukaG712/Slinker"
          echo "  Trapper:     https://github.com/LukaG712/Trapper"
          echo "  Gobber:      https://github.com/LukaG712/Gobber"
          echo "  Sneaker:     https://github.com/LukaG712/Sneaker"
          echo "  Hider:       https://github.com/LukaG712/Hider"
          echo "  Poltergeist: https://github.com/LukaG712/Poltergeist"
          echo "  Shrewd:      https://github.com/LukaG712/Shrewd"
          echo "  Slammer:     https://github.com/LukaG712/Slammer"
          echo ""
          echo "This root CI validates orchestration files only."
